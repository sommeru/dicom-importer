name: DICOMImporter
options:
  bundleIdPrefix: de.sommeru
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  DICOMImporterCore:
    path: Core

targets:
  DICOMImporter:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DICOMImporterCore
    settings:
      base:
        PRODUCT_NAME: DICOM-Importer
        PRODUCT_BUNDLE_IDENTIFIER: de.sommeru.DICOMImporter
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/DICOMImporter.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

schemes:
  DICOMImporter:
    build:
      targets:
        DICOMImporter: all
    run:
      config: Debug
    archive:
      config: Release
