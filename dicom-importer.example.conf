# Voreinstellungen für DICOM-Importer
# Kopieren nach ~/.dicom-importer  (pro Benutzer)
# oder nach /Library/Application Support/DICOM-Importer/dicom-importer.conf  (für alle Benutzer des Macs)
# Hier gesetzte Werte sind in den Einstellungen der App gesperrt. Nicht gesetzte Werte bleiben frei wählbar.

[archive]
# webdav (empfohlen) oder folder
type = webdav
url = https://192.168.2.40:5001/Dicom
user = team
# Optional. Wird beim Start in den Schlüsselbund übernommen.
# Datei dann nur für sich lesbar machen:  chmod 600 ~/.dicom-importer
# password = …
# Optional: SHA-256-Fingerabdruck eines selbstsignierten NAS-Zertifikats
# certificate_sha256 = AB:CD:…

# Nur für type = folder:
# folder = /Volumes/Dicom

[general]
auto_scan = true
eject = true
capitalize_names = false
